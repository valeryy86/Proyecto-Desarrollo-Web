<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo-Sky V Cosmetic</title>
    <link rel = "stylesheet" href = "styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar"> 
            <div class="logo">
                <img src="/img/logoSkyV.jpeg" alt="Logo SkyV Cosmetics">
            </div>
            <button class="hamburger" id="hamburger-btn" aria-label="Abrir menú">
            &#9776;
            </button>

            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="seccion-catalogo">
            <h1 class="titulo-catalogo">Nuestro Catálogo</h1>

            <div class="contenedor-filtros">
                <button class="btn-filtro activo" data-marca="todos">Todos</button>
                <button class="btn-filtro" data-marca="atenea">Atenea</button>
                <button class="btn-filtro" data-marca="bloomshell">Bloomshell</button>
                <button class="btn-filtro" data-marca="anik">Ani-k</button>
                <button class="btn-filtro" data-marca="montoc">Montoc</button>
                <button class="btn-filtro" data-marca="click">Click Hair</button>
                <button class="btn-filtro" data-marca="milagros">Milagros</button>
                <button class="btn-filtro" data-marca="ole">Olé</button>
                <button class="btn-filtro" data-marca="kaba">Kaba</button>
            </div>

            <div class="productos-grid" id="productos-grid">

                <article class="card-producto">
                    <img src="/img/logoAtenea.png" alt="Paleta Atenea">
                    <div class="info-producto">
                        <span class="marca-tag">Atenea</span>
                        <h3>Paleta de Sombras</h3>
                        <p class="precio">$45.000</p>
                        <button class="btn-comprar">Añadir al carrito</button>
                    </div>
                </article>
            </div>
        </section>    
    </main>
    <script src="main.js"></script>
</body>
</html>
